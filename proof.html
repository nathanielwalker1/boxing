<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocap proof</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #07070b; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app > canvas { display: block; width: 100% !important; height: 100% !important; }
    #hud, #label {
      position: fixed; z-index: 20; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #9fd; opacity: .8;
      background: rgba(0,0,0,.4); padding: 3px 6px; border-radius: 4px; pointer-events: none; white-space: pre;
    }
    #hud { left: 8px; top: 8px; }
    #label { left: 8px; bottom: 8px; }
    #pick { position: fixed; right: 8px; top: 8px; z-index: 21; font: 11px ui-monospace, Menlo, monospace; opacity: .85; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="label"></div>
  <select id="pick"></select>
  <script type="module" src="/src/human/proof.ts"></script>
</body>
</html>
