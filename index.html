<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Boxing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0c; overflow: hidden; touch-action: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #fps {
      position: fixed; left: 8px; bottom: 8px; z-index: 20;
      font: 12px/1.3 ui-monospace, Menlo, monospace; color: #9fd; opacity: .85;
      background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 4px; pointer-events: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="fps" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
